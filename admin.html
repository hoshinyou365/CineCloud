<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineCloud | Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="logo" href="index.html">Cine<span>Cloud</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="movies.html">Movies</a></li>
    <li><a href="booking.html">Booking</a></li>
    <li><a class="active" href="admin.html">Admin</a></li>
  </ul>
</nav>

<main class="admin-container">
  <div class="admin-header">
    <div>
      <h1>Movie Management</h1>
      <p class="muted">Create, read, update and delete movie records.</p>
    </div>
  </div>

  <div id="adminMessage"></div>

  <section class="admin-form">
    <h2 id="formTitle">Add Movie</h2>
    <form id="movieForm">
      <input type="hidden" id="movieId">
      <div class="form-grid">
        <div class="form-group">
          <label for="movieTitle">Movie Title</label>
          <input id="movieTitle" type="text" required maxlength="100">
        </div>
        <div class="form-group">
          <label for="movieGenre">Genre</label>
          <input id="movieGenre" type="text" required maxlength="50">
        </div>
        <div class="form-group">
          <label for="movieDuration">Duration (minutes)</label>
          <input id="movieDuration" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label for="moviePrice">Ticket Price (RM)</label>
          <input id="moviePrice" type="number" min="0.01" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="movieImage">Image URL (optional)</label>
          <input id="movieImage" type="text" placeholder="images/movie.svg">
        </div>
      </div>
      <button class="btn" type="submit" id="saveButton">Add Movie</button>
      <button class="btn btn-secondary hidden" type="button" id="cancelButton">Cancel Edit</button>
    </form>
  </section>

  <section class="table-container">
    <table>
      <thead>
        <tr><th>ID</th><th>Title</th><th>Genre</th><th>Duration</th><th>Price</th><th>Actions</th></tr>
      </thead>
      <tbody id="movieTableBody"></tbody>
    </table>
  </section>
</main>

<footer><p>© 2026 <span>CineCloud</span> | Movie Ticket Booking System</p></footer>
<script src="js/admin.js"></script>
</body>
</html>
